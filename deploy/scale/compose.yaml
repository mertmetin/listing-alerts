# Scale and chaos test stack: a 3-broker Redpanda cluster (replication
# factor 3), 3 detectors, 3 matcher shards, delivery, Postgres, Redis and
# monitoring. Separate project and ports from the dev stack.
#
#   make scale-up        (stops the dev stack first: both don't fit in 8 GB)
#   make scale-burst / scale-steady / scale-replay / chaos
#   make scale-down
name: la-scale

x-env: &env
  POSTGRES_URL: postgres://alerts:${POSTGRES_PASSWORD:?run make env}@postgres:5432/alerts?sslmode=disable
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: redpanda-0:9092,redpanda-1:9092,redpanda-2:9092
  LOG_LEVEL: warn

x-broker: &broker
  image: redpandadata/redpanda:v26.2.6
  healthcheck:
    test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
    interval: 5s
    timeout: 5s
    retries: 40
  restart: unless-stopped

x-app: &app
  build:
    context: ../..
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    init: { condition: service_completed_successfully }

services:
  redpanda-0:
    <<: *broker
    command: [redpanda, start, --mode=dev-container, --smp=1, --memory=1G, --default-log-level=warn,
      "--kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:29092",
      "--advertise-kafka-addr=internal://redpanda-0:9092,external://localhost:29092",
      --rpc-addr=redpanda-0:33145, --advertise-rpc-addr=redpanda-0:33145,
      "--seeds=redpanda-0:33145,redpanda-1:33145,redpanda-2:33145"]
    ports: ["29092:29092"]
    volumes: [rp0:/var/lib/redpanda/data]
  redpanda-1:
    <<: *broker
    command: [redpanda, start, --mode=dev-container, --smp=1, --memory=1G, --default-log-level=warn,
      "--kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:29093",
      "--advertise-kafka-addr=internal://redpanda-1:9092,external://localhost:29093",
      --rpc-addr=redpanda-1:33145, --advertise-rpc-addr=redpanda-1:33145,
      "--seeds=redpanda-0:33145,redpanda-1:33145,redpanda-2:33145"]
    ports: ["29093:29093"]
    volumes: [rp1:/var/lib/redpanda/data]
  redpanda-2:
    <<: *broker
    command: [redpanda, start, --mode=dev-container, --smp=1, --memory=1G, --default-log-level=warn,
      "--kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:29094",
      "--advertise-kafka-addr=internal://redpanda-2:9092,external://localhost:29094",
      --rpc-addr=redpanda-2:33145, --advertise-rpc-addr=redpanda-2:33145,
      "--seeds=redpanda-0:33145,redpanda-1:33145,redpanda-2:33145"]
    ports: ["29094:29094"]
    volumes: [rp2:/var/lib/redpanda/data]

  init:
    image: redpandadata/redpanda:v26.2.6
    depends_on:
      redpanda-0: { condition: service_healthy }
      redpanda-1: { condition: service_healthy }
      redpanda-2: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        rpk() { command rpk -X brokers=redpanda-0:9092,redpanda-1:9092,redpanda-2:9092 -X admin.hosts=redpanda-0:9644 "$$@"; }
        for t in listing.changes listing.events alerts.pending; do rpk topic create "$$t" -p 12 -r 3 || true; done
        rpk topic create alerts.dlq -p 3 -r 3 -c retention.ms=2592000000 || true
        rpk cluster config set enable_consumer_group_metrics '["group","partition","consumer_lag"]'
        rpk topic list
    restart: "no"

  postgres:
    image: postgres:17-alpine
    command: [postgres, -c, shared_buffers=512MB, -c, max_connections=300, -c, work_mem=16MB]
    environment:
      POSTGRES_USER: alerts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
      POSTGRES_DB: alerts
    ports: ["15433:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alerts -d alerts"]
      interval: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports: ["16380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30

  api:
    <<: *app
    build: { context: ../.., args: { SERVICE: api } }
    environment:
      <<: *env
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?run make env}
    ports: ["18081:8080"]

  detector:
    <<: *app
    build: { context: ../.., args: { SERVICE: detector } }
    environment:
      <<: *env
      BATCH_SIZE: "1000"
    deploy: { replicas: 3 }

  matcher-0:
    <<: *app
    build: { context: ../.., args: { SERVICE: matcher } }
    environment: { <<: *env, SHARD_INDEX: "0", SHARD_COUNT: "3" }
  matcher-1:
    <<: *app
    build: { context: ../.., args: { SERVICE: matcher } }
    environment: { <<: *env, SHARD_INDEX: "1", SHARD_COUNT: "3" }
  matcher-2:
    <<: *app
    build: { context: ../.., args: { SERVICE: matcher } }
    environment: { <<: *env, SHARD_INDEX: "2", SHARD_COUNT: "3" }

  delivery:
    <<: *app
    build: { context: ../.., args: { SERVICE: delivery } }
    environment:
      <<: *env
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?run make env}
      CHANNEL: discard # measure the pipeline, not a mail server
      SITES_JSON: '{"loadtest":{"name":"Load test","base_url":"https://example.com","listing_url":"https://example.com/listing/{key}","manage_url":"https://example.com/account","sign_in_url":"https://example.com/account"}}'
      SENDERS: "8"
      DAILY_LIMIT: "0"

  prometheus:
    image: prom/prometheus:v3.15.1
    command: [--config.file=/etc/prometheus/prometheus.yml, --web.enable-lifecycle]
    volumes: ["./prometheus:/etc/prometheus:ro"]
    ports: ["19091:9090"]

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make env}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["13300:3000"]

volumes: { rp0: {}, rp1: {}, rp2: {}, pg: {} }
