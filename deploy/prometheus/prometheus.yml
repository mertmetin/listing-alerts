global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: listing-alerts
    static_configs:
      - targets: ["api:8080"]
        labels: { service: api }

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
