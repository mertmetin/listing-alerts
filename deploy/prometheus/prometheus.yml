global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: listing-alerts
    static_configs:
      - targets: ["api:8080"]
        labels: { service: api }

  # Pollers run only with `make live`; DNS discovery finds the ones that are up
  # without reporting the others as down.
  - job_name: pollers
    dns_sd_configs:
      - names: [poller-vow, poller-idx, poller-offmls]
        type: A
        port: 8080
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  # Every detector replica: DNS returns one A record per container.
  - job_name: detector
    dns_sd_configs:
      - names: [detector]
        type: A
        port: 8080
        refresh_interval: 15s
    relabel_configs:
      - target_label: service
        replacement: detector

  - job_name: matcher
    dns_sd_configs:
      - names: [matcher-0, matcher-1, matcher-2]
        type: A
        port: 8080
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: delivery
    static_configs:
      - targets: ["delivery:8080"]
        labels: { service: delivery }

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
