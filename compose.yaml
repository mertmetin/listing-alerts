# Local development stack. Start everything with `make up`.
#
# Host ports are shifted off the usual defaults so this stack can run next to
# other projects (a local Postgres, a Next.js dev server on 3000, and so on).
# Secrets come from .env (created by `make env`, never committed).

name: listing-alerts

x-service-env: &service-env
  POSTGRES_URL: postgres://${POSTGRES_USER:-alerts}:${POSTGRES_PASSWORD:?run make env}@postgres:5432/${POSTGRES_DB:-alerts}?sslmode=disable
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: redpanda:9092
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092" # Kafka API for tools on the host
      - "19644:9644"  # admin API and /public_metrics
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the pipeline topics once, then exits. 12 partitions keyed by
  # ListingKey: enough headroom to scale each consumer group to 12 workers.
  redpanda-init:
    image: redpandadata/redpanda:v26.2.6
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        rpk() { command rpk -X brokers=redpanda:9092 -X admin.hosts=redpanda:9644 "$@"; }
        for t in listing.changes listing.events alerts.pending; do
          rpk topic create "$$t" -p 12 -r 1 || true
        done
        rpk topic create alerts.dlq -p 3 -r 1 -c retention.ms=2592000000 || true
        # Export consumer-group lag on /public_metrics (Grafana: Change detection).
        rpk cluster config set enable_consumer_group_metrics '["group","partition","consumer_lag"]'
        rpk topic list
    restart: "no"

  console:
    image: redpandadata/console:v3.13.1
    depends_on:
      redpanda: { condition: service_healthy }
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8180:8080"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alerts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
      POSTGRES_DB: ${POSTGRES_DB:-alerts}
    ports:
      - "5433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Catches every email in development and in load tests, so nothing ever
  # reaches a real inbox (or Gmail's sending limits). UI on :8025.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build:
      context: .
      args:
        SERVICE: api
    environment:
      <<: *service-env
    ports:
      - "8081:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # Stateless change detectors in one consumer group. Scale with
  # `docker compose up -d --scale detector=N` (up to 12, the partition count).
  detector:
    build:
      context: .
      args:
        SERVICE: detector
    environment:
      <<: *service-env
    deploy:
      replicas: 2
    depends_on:
      postgres: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # Pollers need PropTx tokens, so they only start with `make live`
  # (profile "live"). One replica per source: each cursor has one writer.
  poller-vow:
    <<: &poller
      build:
        context: .
        args:
          SERVICE: poller
      depends_on:
        postgres: { condition: service_healthy }
        redpanda-init: { condition: service_completed_successfully }
      restart: unless-stopped
      profiles: ["live"]
      volumes:
        - ./data:/data
    environment:
      <<: *service-env
      SOURCE: vow
      PROPTX_VOW_TOKEN: ${PROPTX_VOW_TOKEN:-}
      RECORD_DIR: /data/recordings

  poller-idx:
    <<: *poller
    environment:
      <<: *service-env
      SOURCE: idx
      PROPTX_IDX_TOKEN: ${PROPTX_IDX_TOKEN:-}
      RECORD_DIR: /data/recordings

  poller-offmls:
    <<: *poller
    environment:
      <<: *service-env
      SOURCE: offmls
      OFFMLS_FILES: /data/offmls/private-listings.json,/data/offmls/submitted-listings.json
      POLL_INTERVAL: 30s

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      # A directory, not the file: a single-file bind mount pins the old inode,
      # so an edited config would never be seen.
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "3300:3000"
    depends_on:
      - prometheus

volumes:
  redpanda:
  postgres:
  redis:
  prometheus:
  grafana:
